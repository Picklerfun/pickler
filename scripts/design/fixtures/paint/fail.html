<!-- Every paint the token check reads, each a colour no token of its surface holds. -->
<div id="gradient" style="background-image: linear-gradient(#123456, var(--pk-panel))"></div>
<div id="shadow" style="box-shadow: 0 0 24px rgba(255, 0, 0, 0.5)"></div>
<div id="text-shadow" style="text-shadow: 0 0 4px #00ff00">Lit</div>
<div id="drop-shadow" style="filter: drop-shadow(0 0 6px #0000ff)"></div>
<div id="outline" style="outline: 2px solid #ff00ff"></div>
<svg width="20" height="20">
  <rect width="20" height="20" style="fill: #abcdef; stroke: #fedcba" />
</svg>
<div id="wrong-surface" style="background: #15182a"></div>
