<!-- Every paint the token check reads, each from a token of its own surface. -->
<div id="gradient" style="background-image: linear-gradient(var(--pk-bg), var(--pk-panel))"></div>
<div id="shadow" style="box-shadow: var(--pk-shadow)"></div>
<div id="glow" style="box-shadow: 0 0 24px var(--pk-glow)"></div>
<div id="text-shadow" style="text-shadow: 0 0 4px var(--pk-glow)">Lit</div>
<div id="drop-shadow" style="filter: drop-shadow(0 0 6px var(--pk-glow))"></div>
<div id="outline" style="outline: 2px solid var(--pk-lime)"></div>
<div id="no-outline" style="outline-style: none; outline-color: #ff0000"></div>
<svg width="20" height="20">
  <rect width="20" height="20" style="fill: var(--pk-lime); stroke: var(--pk-ink)" />
</svg>
<section data-surface="dark">
  <div id="dark-panel" style="background: var(--pk-panel)">Dark</div>
</section>
<svg width="20" height="20" data-third-party-mark="">
  <rect width="20" height="20" style="fill: #4285f4; stroke: #ea4335" />
</svg>
