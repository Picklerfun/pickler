name: OpenAPI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - run: npm run api:openapi -- --output /tmp/pickler-openapi.json
      - run: node --import tsx --test workers/api/test/openapi.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pickler-openapi
          path: /tmp/pickler-openapi.json
          if-no-files-found: error
