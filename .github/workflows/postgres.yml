name: PostgreSQL integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: pickler
          POSTGRES_PASSWORD: pickler_local_only
          POSTGRES_DB: pickler
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pickler -d pickler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:staging
      - run: npm run build:workers
