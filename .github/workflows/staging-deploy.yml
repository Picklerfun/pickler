name: Coordinated staging deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a release after it has started migrating/publishing. Older queued commits
# are rejected against current main before any database mutation.
concurrency:
  group: pickler-coordinated-staging
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOYMENT_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: pickler
          POSTGRES_PASSWORD: pickler_local_only
          POSTGRES_DB: pickler
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pickler -d pickler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_OAUTH_X_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - name: Validate deployment settings without remote writes
        run: npm run deploy:staging -- --check
        env:
          STAGING_DEPLOYMENT_ENABLED: ${{ vars.STAGING_DEPLOYMENT_ENABLED }}
          STAGING_WORKER_BUILDS_DISABLED: ${{ vars.STAGING_WORKER_BUILDS_DISABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_MIGRATION_CA_CERT: ${{ secrets.DATABASE_MIGRATION_CA_CERT }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run api:openapi -- --output /tmp/pickler-openapi.json
      - run: npm run check:staging -- --provisioned
      - run: npm run build:workers
      - name: Migrate then publish Research, Trading, API and Web
        run: npm run deploy:staging -- --run
        env:
          STAGING_DEPLOYMENT_ENABLED: ${{ vars.STAGING_DEPLOYMENT_ENABLED }}
          STAGING_WORKER_BUILDS_DISABLED: ${{ vars.STAGING_WORKER_BUILDS_DISABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_MIGRATION_CA_CERT: ${{ secrets.DATABASE_MIGRATION_CA_CERT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-release-${{ github.sha }}
          path: |
            .data/staging-deployment.json
            /tmp/pickler-openapi.json
          include-hidden-files: true
          if-no-files-found: ignore
